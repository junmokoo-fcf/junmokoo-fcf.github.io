  --body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){

    --bg:#17120F; --surface:#211A16; --ink:#F2EAE2; --muted:#B5A79B; --line:#372D27;

}

  --accent:#F09A82; --accent-soft:#3B241F; --f-sub:#5C5048;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--body);margin:0}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2.1rem,5vw,3.4rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:clamp(1.6rem,3vw,2.1rem);font-weight:600;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:600}
.eyebrow{font:500 .75rem/1.5 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--mono);font-size:.86em}
p{margin:0;max-width:66ch}
.muted{color:var(--muted)}

/* header */
header.site{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand-mark{display:grid;gap:3px;width:26px}
.brand-mark i{display:block;height:5px;border-radius:1px}
.brand-mark i:nth-child(1){background:var(--f-pu)}.brand-mark i:nth-child(2){background:var(--f-bl)}.brand-mark i:nth-child(3){background:var(--f-te)}
.brand-name{font:700 1.15rem/1 var(--display);letter-spacing:.06em}
.brand-sub{display:block;font:400 .72rem/1.2 var(--body);color:var(--muted);letter-spacing:0;margin-top:3px}
nav.main ul{display:flex;gap:2px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
nav.main a{display:block;padding:8px 10px;color:var(--muted);text-decoration:none;font:500 .95rem/1 var(--display);border-radius:4px}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--ink);border-radius:4px;padding:8px 12px;font:500 .9rem var(--display);cursor:pointer}
@media (max-width:900px){
  .menu-btn{display:block}
  nav.main{display:none;width:100%}
  nav.main.open{display:block;padding-bottom:12px}
  nav.main ul{flex-direction:column}
  .bar{flex-wrap:wrap}
}

main{padding-block:48px 72px;min-height:60vh}
.page{display:grid;gap:56px}
.page-head{display:grid;gap:12px;padding-bottom:8px}
section.block{display:grid;gap:20px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:10px}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;min-height:440px;align-content:center;margin-top:-16px}
.hero .lede{font-size:1.2rem;color:var(--muted);max-width:52ch}
.hero-copy{position:relative;z-index:1;display:grid;gap:20px;max-width:640px}
.hero-copy h1{max-width:none}
#ald{position:absolute;top:-24px;right:-40px;width:64%;height:calc(100% + 24px);display:block;pointer-events:none}
.acr{font:500 .9rem/1.6 var(--mono);color:var(--muted);white-space:nowrap;max-width:none}
@media (max-width:620px){.acr{white-space:normal;font-size:.8rem}}
.acr b{color:var(--accent);font-weight:500}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 16px;border-radius:4px;font:600 .95rem/1 var(--display);text-decoration:none;border:1px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--bg)}
.btn.ghost{color:var(--accent);background:var(--bg)}
@media (max-width:900px){
  .hero{min-height:0}
  #ald{position:relative;top:0;right:0;width:100%;height:300px;order:2}
  .hero-copy h1{max-width:none}
}

/* cards */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g3{grid-template-columns:1fr}}
@media (max-width:620px){.g2,.g4{grid-template-columns:1fr}}
.theme{display:grid;gap:10px;align-content:start;padding-top:16px;border-top:3px solid var(--c,var(--accent))}
.theme .tag{font:500 .75rem/1 var(--mono);color:var(--muted);letter-spacing:.06em}
.theme p{font-size:.97rem;color:var(--muted)}

/* research detail */
.rs{display:grid;grid-template-columns:220px 1fr;gap:32px;padding-block:28px;border-top:1px solid var(--line)}
.rs:first-child{border-top:0;padding-top:0}
.rs .side{display:grid;gap:8px;align-content:start}
.rs .swatch{width:40px;height:8px;background:var(--c)}
.rs .body{display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.chips li{font:400 .8rem/1 var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:3px;color:var(--muted);background:var(--surface)}
@media (max-width:720px){.rs{grid-template-columns:1fr;gap:12px}}

.list{list-style:none;margin:0;padding:0;display:grid}
.list > li{display:grid;grid-template-columns:120px 1fr;gap:20px;padding-block:14px;border-top:1px solid var(--line)}
.list > li:first-child{border-top:0}
.when{font:400 .85rem/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:620px){.list > li{grid-template-columns:1fr;gap:4px}}

.pubs{list-style:none;margin:0;padding:0;display:grid;counter-reset:none}

.pubs li:first-child{border-top:0}

.pubs .t{font-weight:600}
.pubs .a{color:var(--muted);font-size:.95rem}

.badge.done{background:transparent;border:1px solid var(--line);color:var(--muted)}
.year-h{font:600 1rem/1 var(--display);color:var(--muted);padding-top:18px}

table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .75rem/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

table.teach .r{text-align:right;padding-right:28px}

.portrait{display:block;width:100%;height:auto;max-width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;border-radius:4px;background:var(--line)}

.copy{font:500 .8rem/1 var(--display);padding:6px 10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:3px;cursor:pointer}

footer{border-top:1px solid var(--line);padding-block:28px;color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.page{animation:rise .35s ease-out both}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}

/* ============ ALD CYCLE ANIMATION (hero) ============ */
const ALD = (() => {
  let raf = 0, t0 = 0;
  const T = 8.0, NC = 5;                // time units per ALD cycle; cycles before the film resets
  const NX = 13, NY = 1, LAYER = 1.1;  // front-view row of surface sites and layer height (atom units)
  // deterministic random
  let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const sites = [];
  for (let i = 0; i < NX; i++) for (let j = 0; j < NY; j++)
    sites.push({ i, j, a: 0.1 + rnd() * 1.4, w: 3.5 + rnd() * 1.5, ox: (rnd() - .5) * 3, oy: (rnd() - .5) * 3, fly: rnd() < 2 });   // every molecule arrives from the gas phase
  const excess = [];
  for (let k = 0; k < 5; k++) excess.push({ kind: k < 3 ? "tma" : "h2o", t: k < 3 ? 1.7 + rnd() * .8 : 5.2 + rnd() * .7, i: rnd() * (NX - 1), j: 0, dx: (rnd() - .5) * 6, dy: (rnd() - .5) * 6 });

  const hex = h => { h = h.trim(); if (h.startsWith("#")) { if (h.length === 4) h = "#" + [...h.slice(1)].map(c => c + c).join(""); return [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)); } return [150, 160, 170]; };
  const mix = (c, m, f) => c.map((v, k) => Math.round(v + (m[k] - v) * f));
  const css = c => `rgb(${c[0]},${c[1]},${c[2]})`;
  const ease = x => x < 0 ? 0 : x > 1 ? 1 : x * x * (3 - 2 * x);

  function palette() {
    const cs = getComputedStyle(document.documentElement);
    const g = n => hex(cs.getPropertyValue(n));
    return { al: g("--f-pu"), me: g("--f-bl"), o: g("--f-te"), sub: g("--f-sub"), h: [244, 238, 230], bg: g("--bg") };
  }

  function draw(ctx, W, H, tt, pal) {
    ctx.clearRect(0, 0, W, H);
    const ov = tt % (T * NC), n = Math.floor(ov / T), tc = ov - n * T;
    const ga = ease(ov / 1.0) * (1 - ease((ov - (T * NC - 1.4)) / 1.4));   // fade in at start, out before reset
    const narrow = W < 560;
    const s = Math.min(W / (narrow ? 380 : 560), H / 420, 1.25);
    const dx = 25 * s, dz = 26 * s;
    const cx = W * (narrow ? .5 : .64), baseY = H * (narrow ? .82 : .74);
    const S = m => 0.6 + m * LAYER;                       // surface O height before cycle m
    const cam = S(0);                                    // fixed camera: the film visibly grows upward
    const P = (i, j, z) => [cx + (i - j - (NX - 1) / 2) * dx, baseY - (z - cam) * dz];   // front view
    const atoms = [];
    const add = (i, j, z, r, col, a = 1) => { atoms.push({ i, j, z, r: r * s, col, a: a * ga }); };

    // substrate and completed layers
    for (const st of sites) {
      const { i, j } = st;
      add(i, j, S(0), 11.5, pal.o);
      for (let m = 0; m < n; m++) { add(i, j, S(m) + .55, 12, pal.al); add(i, j, S(m + 1), 11.5, pal.o); }
    }
    // current cycle
    const sz = S(n), alz = sz + .55;
    for (const st of sites) {
      const { i, j } = st;
      const bind = st.a + 1.3, xch = st.w + 1.1;   // slow, visible arrival
      const fin = st.fly ? 1 : ease((tc - st.a) / .7);          // non-flying sites fade in place
      const fxo = st.fly ? 1 : ease((tc - st.w) / .6);
      if (tc < bind) add(i, j, sz + .45, 5.8, pal.h, st.fly || tc < st.a ? 1 : 1 - fin);
      if (!st.fly && tc >= st.a && tc < bind) { add(i, j, alz, 12, pal.al, fin); add(i + .32, j - .05, alz + .5, 8.5, pal.me, fin); add(i - .05, j + .32, alz + .5, 8.5, pal.me, fin); }
      if (tc >= bind) {
        add(i, j, alz, 12, pal.al);
        if (tc < xch) {
          const keep = !st.fly && tc >= st.w ? 1 - fxo : 1;
          add(i + .32, j - .05, alz + .5, 8.5, pal.me, keep); add(i - .05, j + .32, alz + .5, 8.5, pal.me, keep);
          if (!st.fly && tc >= st.w) { add(i, j, S(n + 1), 11.5, pal.o, fxo); add(i, j, S(n + 1) + .42, 5.8, pal.h, fxo); }
        } else { add(i, j, S(n + 1), 11.5, pal.o); add(i, j, S(n + 1) + .42, 5.8, pal.h); }
      }
      if (!st.fly) continue;
      // incoming TMA
      if (tc >= st.a && tc < bind) {
        const f = ease((tc - st.a) / 1.3), z = alz + (1 - f) * 7;
        const ii = i + st.ox * (1 - f), jj = j + st.oy * (1 - f);
        add(ii, jj, z, 12, pal.al); add(ii + .32, jj - .05, z + .45, 8.5, pal.me); add(ii - .05, jj + .32, z + .45, 8.5, pal.me); add(ii - .3, jj - .3, z + .2, 8.5, pal.me);
      }
      // CH4 leaving after binding and after exchange
      for (const tb of [bind, xch]) if (tc >= tb && tc < tb + 1.1) {
        const f = (tc - tb) / 1.1;
        add(i - .3 + f * 1.2, j - .3 - f * .8, alz + .6 + f * 5.5, 8, pal.me, 1 - f);
      }
      // incoming H2O
      if (tc >= st.w && tc < xch) {
        const f = ease((tc - st.w) / 1.1), z = S(n + 1) + (1 - f) * 7;
        const ii = i + st.oy * (1 - f), jj = j - st.ox * (1 - f);
        add(ii, jj, z, 11.5, pal.o); add(ii + .25, jj, z + .3, 5.8, pal.h); add(ii, jj + .25, z + .3, 5.8, pal.h);
      }
    }
    // excess precursor bouncing off the saturated surface (self-limiting)
    for (const e of excess) {
      if (tc < e.t || tc > e.t + 1.6) continue;
      const u = (tc - e.t) / 1.6, down = u < .45, f = down ? ease(u / .45) : (u - .45) / .55;
      const top = (e.kind === "tma" ? alz + 1.3 : S(n + 1) + 1.1);
      const z = down ? top + (1 - f) * 6.5 : top + f * 6.5;
      const ii = e.i + (down ? 0 : e.dx * f), jj = e.j + (down ? 0 : e.dy * f), a = down ? 1 : 1 - f;
      if (e.kind === "tma") { add(ii, jj, z, 12, pal.al, a); add(ii + .32, jj - .05, z + .45, 8.5, pal.me, a); add(ii - .05, jj + .32, z + .45, 8.5, pal.me, a); add(ii - .3, jj - .3, z + .2, 8.5, pal.me, a); }
      else { add(ii, jj, z, 11.5, pal.o, a); add(ii + .25, jj, z + .3, 5.8, pal.h, a); add(ii, jj + .25, z + .3, 5.8, pal.h, a); }
    }
    atoms.sort((p, q) => p.z - q.z);
    for (const at of atoms) {
      const [x, y] = P(at.i, at.j, at.z);
      if (y < -20 || y > H + 20) continue;
      const g = ctx.createRadialGradient(x - at.r * .35, y - at.r * .4, at.r * .1, x, y, at.r);
      g.addColorStop(0, css(mix(at.col, [255, 255, 255], .55)));
      g.addColorStop(.55, css(at.col));
      g.addColorStop(1, css(mix(at.col, [0, 0, 0], .45)));
      ctx.globalAlpha = at.a; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, at.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    return tc;
  }

  function start() {
    cancelAnimationFrame(raf);
    const cv = document.getElementById("ald"); if (!cv) return;
    const ctx = cv.getContext("2d");
    let pal = palette(), W = 0, H = 0;
    const size = () => { const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    size();
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { draw(ctx, W, H, T * 3 + 7.9, pal); return; }
    t0 = performance.now();
    const loop = now => {
      if (!cv.isConnected) return;
      if (!document.hidden) { const r = cv.getBoundingClientRect(); if (Math.abs(r.width - W) > 1 || Math.abs(r.height - H) > 1) size(); draw(ctx, W, H, (now - t0) / 4000, pal); } // quarter speed
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { pal = palette(); });
    new MutationObserver(() => { pal = palette(); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }
  return { start };
})();

        <section class="block"><div class="sec-title"><h3>Honors and awards</h3></div>${kvList(PI.awards)}</section>
        <section class="block"><div class="sec-title"><h3>Journal reviewer</h3></div><ul class="list">${PI.reviewer.map(([j,n])=>`<li style="grid-template-columns:1fr"><span>${esc(j)} <span class="muted">(${n})</span></span></li>`).join("")}</ul></section>
      </div>
    </section>
    <section class="block">
      <div class="sec-title"><h2>Students</h2></div>
      <div class="grid g4">${STUDENTS.map(s=>`<div class="person"><h3>${esc(s.name)}</h3><span class="muted" style="font-size:.93rem">${esc(s.role)}</span></div>`).join("")}</div>
    </section>
  </div>`;

let pubTab = "journal";
function pubBody(){
  if (pubTab==="journal"){
    let html = `<li style="display:block;border-top:0;padding:0"><div class="year-h">Under review</div></li>`;
    UNDER_REVIEW.forEach(p=>{ html += `<li><span class="n">R${p.n}</span><div><div class="t">${esc(p.t)}</div><div class="a">${mark(p.a)}</div><div class="muted" style="font-size:.93rem">Under review</div></div></li>`; });
    let lastY = null;
    PUBS.forEach(p=>{
      if (p.y!==lastY){ html += `<li style="display:block;border-top:0;padding:0"><div class="year-h">${p.y}</div></li>`; lastY=p.y; }
      html += `<li><span class="n">${p.n}</span><div><div class="t">${esc(p.t)}</div><div class="a">${mark(p.a)}</div><div><span class="j">${esc(p.j)}</span> ${esc(p.v)} (${p.y}) · <a href="https://doi.org/${p.doi}" target="_blank" rel="noopener">DOI</a>${p.note?`<span class="badge">${esc(p.note)}</span>`:""}</div></div></li>`;
    });
    return `<p class="muted" style="font-size:.9rem">† Equal contribution &nbsp; * Corresponding author</p><ul class="pubs">${html}</ul>`;
  }
  if (pubTab==="patents"){
    const block = (arr) => `<div class="table-wrap"><table><thead><tr><th>No.</th><th>Title</th><th>Inventors</th></tr></thead><tbody>${arr.map(([no,t,a,st])=>`<tr><td class="num">${no}</td><td>${st?`<span class="badge lead">${esc(st)}</span>`:""}${esc(t)}</td><td class="muted">${mark(a)}</td></tr>`).join("")}</tbody></table></div>`;
    return `<section class="block"><h3>Issued patents (Korea)</h3>${block(PATENTS_ISSUED)}</section><section class="block" style="margin-top:28px"><h3>Patent applications (Korea)</h3>${block(PATENTS_APPLIED)}</section>`;
  }
  return `<ul class="list">${TALKS.map(([d,k,t,v])=>`<li><span class="when">${d}</span><span><strong>${esc(t)}</strong>${k==="Invited"?`<span class="badge">Invited</span>`:""}<br><span class="muted" style="font-size:.93rem">${esc(v)}</span></span></li>`).join("")}</ul>`;
}
R.publications = () => `
  <div class="page">
    <div class="page-head"><span class="eyebrow">Publications</span><h1>Papers, patents and presentations</h1>
    <p class="muted">${PUBS.length} journal articles and ${UNDER_REVIEW.length} under review · ${PATENTS_ISSUED.length} issued patents · ${PATENTS_APPLIED.length} patent applications. Full list on <a href="${LAB.scholar}" target="_blank" rel="noopener">Google Scholar</a>.</p></div>
    <div class="tabs" role="tablist" id="pub-tabs">
      <button role="tab" id="tab-journal" data-t="journal" aria-selected="${pubTab==="journal"}">Journal articles</button>
      <button role="tab" id="tab-patents" data-t="patents" aria-selected="${pubTab==="patents"}">Patents</button>
      <button role="tab" id="tab-talks" data-t="talks" aria-selected="${pubTab==="talks"}">Presentations</button>
    </div>
    <div id="pub-body">${pubBody()}</div>
  </div>`;

R.projects = () => {
  const row = p => `<tr><td class="num period">${p.p[0]} –<br>${p.p[1]}</td><td>${p.end>=NOW?`<span class="badge lead">Ongoing</span>`:""}${esc(p.t)}</td><td class="muted">${esc(p.s)}</td><td class="muted">${esc(p.prog)}</td><td>${p.r}</td></tr>`;
  return `<div class="page"><div class="page-head"><span class="eyebrow">Projects</span><h1>Research projects</h1></div>
  <div class="table-wrap"><table class="proj"><colgroup><col style="width:104px"><col><col style="width:150px"><col style="width:165px"><col style="width:140px"></colgroup><thead><tr><th>Period</th><th>Project</th><th>Sponsor</th><th>Program</th><th>Role</th></tr></thead><tbody>${PROJECTS.map(row).join("")}</tbody></table></div></div>`;
};

R.teaching = () => `
  <div class="page"><div class="page-head"><span class="eyebrow">Teaching</span><h1>Courses</h1></div>
  ${TEACHING.map(([sem,rows])=>`<section class="block"><div class="sec-title"><h3>${sem}</h3></div><div class="table-wrap"><table class="teach"><colgroup><col><col style="width:130px"><col style="width:150px"></colgroup><thead><tr><th>Course</th><th class="r">Enrollment</th><th>Evaluation</th></tr></thead><tbody>${rows.map(([c,n,e])=>`<tr><td>${esc(c)}</td><td class="num r">${n ?? "–"}</td><td class="num">${e == null ? `<span class="muted">In progress</span>` : `<span class="score"><span class="meter" aria-hidden="true"><i style="width:${e/5*100}%"></i></span>${e.toFixed(1)}</span>`}</td></tr>`).join("")}</tbody></table></div></section>`).join("")}
  </div>`;

R.news = () => {
  const years = [...new Set(NEWS.map(n=>n[0].slice(0,4)))];
  return `<div class="page"><div class="page-head"><span class="eyebrow">News</span><h1>Lab news</h1></div>
  ${years.map(y=>`<section class="block"><div class="sec-title"><h2>${y}</h2></div><ul class="list">${NEWS.filter(n=>n[0].startsWith(y)).map(([d,t])=>`<li><span class="when">${ym(d)}</span><span>${esc(t)}</span></li>`).join("")}</ul></section>`).join("")}</div>`;
};

R.contact = () => `
  <div class="page contact-page">
    <div class="page-head"><span class="eyebrow">Contact</span><h1>Visit or write to us</h1></div>
    <section class="block contact-item">
      <span class="eyebrow">Address</span>
      <p>${LAB.address.map(esc).join("<br>")}</p>
      <p><a href="https://www.google.com/maps/search/?api=1&query=Korea+Maritime+and+Ocean+University" target="_blank" rel="noopener">Open in Google Maps</a></p>
    </section>
    <section class="block contact-item">
      <span class="eyebrow">E-mail</span>
      <div class="copyline"><span class="mono">${LAB.email}</span><button class="copy" data-copy="${LAB.email}" id="copy-mail">Copy</button></div>
    </section>
  </div>`;

function route(){
  const id = (location.hash || "#home").slice(1);
  const page = R[id] ? id : "home";
  $("#app").innerHTML = R[page]();
  document.querySelectorAll("#nav-list a").forEach(a => a.setAttribute("aria-current", a.dataset.p===page ? "page" : "false"));
  $("#nav").classList.remove("open"); $("#menu-btn").setAttribute("aria-expanded","false");
  window.scrollTo(0,0);
  if (page === "home") ALD.start();
}
$("#nav-list").innerHTML = PAGES.map(([id,l])=>`<li><a href="#${id}" data-p="${id}">${l}</a></li>`).join("");
$("#menu-btn").addEventListener("click", () => { const o = $("#nav").classList.toggle("open"); $("#menu-btn").setAttribute("aria-expanded", String(o)); });
document.addEventListener("click", e => {
  const tab = e.target.closest("#pub-tabs button");
  if (tab){ pubTab = tab.dataset.t; document.querySelectorAll("#pub-tabs button").forEach(b=>b.setAttribute("aria-selected", String(b===tab))); $("#pub-body").innerHTML = pubBody(); }
  const c = e.target.closest("button.copy");
  if (c){ const txt = c.dataset.copy; const done = () => { c.textContent = "Copied"; setTimeout(()=>c.textContent="Copy",1500); };
    try { navigator.clipboard.writeText(txt).then(done, () => { const r=document.createRange(); r.selectNodeContents(c.previousElementSibling); getSelection().removeAllRanges(); getSelection().addRange(r); }); } catch(_){} }
});
window.addEventListener("hashchange", route);
route();
</script>
</body></html>
